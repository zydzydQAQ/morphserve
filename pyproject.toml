[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphserve"
version = "0.1.0"
description = "MorphServe: Exact Paradigm-Aware Serving for Native Unified Multimodal (Interleaved AR + DiT) Models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
