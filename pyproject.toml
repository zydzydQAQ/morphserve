[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphserve"
version = "0.2.0"
description = "MorphServe: C++17 Control & VMM Engine with Python Tensor Data Engine for Interleaved Multimodal Serving"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "slow: slow deploy/build/packaging contract tests (skip with -m 'not slow')",
]
